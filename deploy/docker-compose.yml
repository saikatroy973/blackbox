services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: blackbox
      POSTGRES_PASSWORD: blackbox
      POSTGRES_DB: blackbox
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackbox -d blackbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  blackbox:
    build:
      context: ..
      dockerfile: Dockerfile
    image: blackbox:dev
    ports:
      - "8080:8080"
    command:
      - serve
      - -addr
      - ":8080"
      - -db
      - postgres://blackbox:blackbox@postgres:5432/blackbox?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/blackbox", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s

volumes:
  postgres-data:
