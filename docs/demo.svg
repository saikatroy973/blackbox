<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Blackbox dashboard demo: live trace list and span waterfall">
  <style>
    .row { animation: appear 8s infinite; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 8s infinite; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes appear {
      0%   { opacity: 0; }
      4%   { opacity: 0; }
      9%   { opacity: 1; }
      92%  { opacity: 1; }
      97%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes grow {
      0%   { transform: scaleX(0); }
      14%  { transform: scaleX(0); }
      26%  { transform: scaleX(1); }
      92%  { transform: scaleX(1); }
      97%  { transform: scaleX(0); }
      100% { transform: scaleX(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes blink {
      0%, 60% { opacity: 1; }
      61%, 100% { opacity: 0; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="960" height="430" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="960" height="430" fill="#0e1014"/>

    <!-- top bar -->
    <rect x="0" y="0" width="960" height="50" fill="#161a21"/>
    <line x1="0" y1="50" x2="960" y2="50" stroke="#262c37"/>
    <text x="24" y="31" font-size="15" font-weight="700" fill="#e6e8ec">blackbox</text>
    <text x="112" y="31" font-size="11" fill="#8b93a1">flight recorder for AI agents</text>
    <text x="836" y="31" font-size="12" fill="#e6e8ec">Traces</text>
    <text x="898" y="31" font-size="12" fill="#8b93a1">Evals</text>

    <!-- page heading -->
    <text x="24" y="92" font-size="20" font-weight="700" fill="#e6e8ec">Traces</text>
    <circle class="dot" cx="104" cy="85" r="4" fill="#2fbf71"/>

    <!-- trace list panel -->
    <rect x="24" y="110" width="560" height="170" rx="10" fill="#161a21" stroke="#262c37"/>
    <text x="40"  y="133" font-size="10" fill="#8b93a1">NAME</text>
    <text x="196" y="133" font-size="10" fill="#8b93a1">TRACE</text>
    <text x="306" y="133" font-size="10" fill="#8b93a1">STATUS</text>
    <text x="386" y="133" font-size="10" fill="#8b93a1">STARTED</text>
    <text x="502" y="133" font-size="10" fill="#8b93a1">DURATION</text>
    <text x="556" y="133" font-size="10" fill="#8b93a1">SPANS</text>

    <g class="row" style="animation-delay:.15s">
      <text x="40" y="164" font-size="12" font-weight="600" fill="#e6e8ec">research-agent</text>
      <text x="196" y="164" font-size="11" fill="#8b93a1" class="mono">8f31c2a09d4e</text>
      <rect x="304" y="151" width="34" height="16" rx="8" fill="#2fbf71"/>
      <text x="313" y="163" font-size="10" font-weight="700" fill="#0c2417">ok</text>
      <text x="386" y="164" font-size="11" fill="#8b93a1" class="mono">14:22:31.482</text>
      <text x="502" y="164" font-size="11" fill="#8b93a1" class="mono">1.4s</text>
      <text x="566" y="164" font-size="11" fill="#8b93a1" class="mono">6</text>
    </g>
    <g class="row" style="animation-delay:.35s">
      <text x="40" y="194" font-size="12" font-weight="600" fill="#e6e8ec">research-agent</text>
      <text x="196" y="194" font-size="11" fill="#8b93a1" class="mono">3b77e1f40c8a</text>
      <rect x="304" y="181" width="34" height="16" rx="8" fill="#2fbf71"/>
      <text x="313" y="193" font-size="10" font-weight="700" fill="#0c2417">ok</text>
      <text x="386" y="194" font-size="11" fill="#8b93a1" class="mono">14:22:29.107</text>
      <text x="502" y="194" font-size="11" fill="#8b93a1" class="mono">1.2s</text>
      <text x="566" y="194" font-size="11" fill="#8b93a1" class="mono">6</text>
    </g>
    <g class="row" style="animation-delay:.55s">
      <text x="40" y="224" font-size="12" font-weight="600" fill="#e6e8ec">research-agent</text>
      <text x="196" y="224" font-size="11" fill="#8b93a1" class="mono">c94d0ab5e7f2</text>
      <rect x="304" y="211" width="44" height="16" rx="8" fill="#ff5c5c"/>
      <text x="311" y="223" font-size="10" font-weight="700" fill="#2b0b0b">error</text>
      <text x="386" y="224" font-size="11" fill="#8b93a1" class="mono">14:22:27.845</text>
      <text x="502" y="224" font-size="11" fill="#8b93a1" class="mono">1.4s</text>
      <text x="566" y="224" font-size="11" fill="#8b93a1" class="mono">5</text>
    </g>
    <g class="row" style="animation-delay:.75s">
      <text x="40" y="254" font-size="12" font-weight="600" fill="#e6e8ec">research-agent</text>
      <text x="196" y="254" font-size="11" fill="#8b93a1" class="mono">1a02be77c3d9</text>
      <rect x="304" y="241" width="34" height="16" rx="8" fill="#2fbf71"/>
      <text x="313" y="253" font-size="10" font-weight="700" fill="#0c2417">ok</text>
      <text x="386" y="254" font-size="11" fill="#8b93a1" class="mono">14:22:25.210</text>
      <text x="502" y="254" font-size="11" fill="#8b93a1" class="mono">1.1s</text>
      <text x="566" y="254" font-size="11" fill="#8b93a1" class="mono">6</text>
    </g>

    <!-- span waterfall panel -->
    <rect x="24" y="296" width="560" height="110" rx="10" fill="#161a21" stroke="#262c37"/>
    <text x="40" y="318" font-size="10" fill="#8b93a1" class="mono">8f31c2a09d4e · research-agent</text>

    <g class="row" style="animation-delay:.95s">
      <circle cx="44" cy="333" r="4" fill="#4c8dff"/>
      <text x="56" y="337" font-size="11" fill="#e6e8ec">research-agent</text>
      <rect x="200" y="329" width="360" height="8" rx="4" fill="#1c212b"/>
      <rect class="bar" style="animation-delay:2.1s" x="200" y="329" width="360" height="8" rx="4" fill="#4c8dff"/>
      <text x="568" y="337" font-size="10" fill="#8b93a1" class="mono">1.4s</text>
    </g>
    <g class="row" style="animation-delay:1.05s">
      <circle cx="56" cy="353" r="4" fill="#8b93a1"/>
      <text x="68" y="357" font-size="11" fill="#e6e8ec">step-1</text>
      <rect x="200" y="349" width="360" height="8" rx="4" fill="#1c212b"/>
      <rect class="bar" style="animation-delay:2.25s" x="200" y="349" width="336" height="8" rx="4" fill="#8b93a1"/>
      <text x="568" y="357" font-size="10" fill="#8b93a1" class="mono">1.3s</text>
    </g>
    <g class="row" style="animation-delay:1.15s">
      <circle cx="68" cy="373" r="4" fill="#a06bff"/>
      <text x="80" y="377" font-size="11" fill="#e6e8ec">decide</text>
      <rect x="200" y="369" width="360" height="8" rx="4" fill="#1c212b"/>
      <rect class="bar" style="animation-delay:2.4s" x="200" y="369" width="132" height="8" rx="4" fill="#a06bff"/>
      <text x="568" y="377" font-size="10" fill="#8b93a1" class="mono">0.4s</text>
    </g>
    <g class="row" style="animation-delay:1.25s">
      <circle cx="80" cy="393" r="4" fill="#2fbf71"/>
      <text x="92" y="397" font-size="11" fill="#e6e8ec">web_search</text>
      <rect x="200" y="389" width="360" height="8" rx="4" fill="#1c212b"/>
      <rect class="bar" style="animation-delay:2.55s" x="200" y="389" width="108" height="8" rx="4" fill="#2fbf71"/>
      <text x="568" y="397" font-size="10" fill="#8b93a1" class="mono">0.7s</text>
    </g>

    <!-- inspector panel -->
    <rect x="600" y="110" width="336" height="296" rx="10" fill="#161a21" stroke="#262c37"/>
    <text x="620" y="136" font-size="11" font-weight="600" fill="#e6e8ec">web_search</text>
    <rect x="710" y="124" width="46" height="15" rx="4" fill="none" stroke="#262c37"/>
    <text x="718" y="135" font-size="9" fill="#8b93a1" class="mono">tool.call</text>
    <text x="620" y="160" font-size="10" fill="#8b93a1" class="mono">duration 0.7s · cost $0.00021</text>

    <text x="620" y="188" font-size="10" fill="#8b93a1">INPUT</text>
    <rect x="620" y="196" width="296" height="72" rx="6" fill="#1c212b" stroke="#262c37"/>
    <text x="632" y="216" font-size="11" fill="#e6e8ec" class="mono">{</text>
    <text x="632" y="232" font-size="11" fill="#8b93a1" class="mono">"query": "capital of france"</text>
    <text x="632" y="248" font-size="11" fill="#e6e8ec" class="mono">}</text>
    <text x="632" y="262" font-size="11" fill="#e6e8ec" class="mono"><tspan class="cursor">▊</tspan></text>

    <text x="620" y="292" font-size="10" fill="#8b93a1">OUTPUT</text>
    <rect x="620" y="300" width="296" height="56" rx="6" fill="#1c212b" stroke="#262c37"/>
    <text x="632" y="322" font-size="11" fill="#8b93a1" class="mono">"Paris is the capital of France."</text>
    <text x="632" y="340" font-size="11" fill="#8b93a1" class="mono">City population: about 2.1M…</text>

    <circle class="dot" cx="624" cy="380" r="4" fill="#2fbf71"/>
    <text x="636" y="384" font-size="11" fill="#8b93a1">live · server-rendered HTMX dashboard, SSE refresh</text>
  </g>
</svg>
